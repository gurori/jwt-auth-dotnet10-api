services:
  api:
    ports:
      - "8080:8080"
    build:
      context: .
      dockerfile: ./Dockerfile
    networks:
      - app_network
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18
    restart: always
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ites -d itesdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_network
    volumes:
      - postgres_data:/var/lib/postgresql

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data: